services:
  - type: web
    name: CyberEagle
    env: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: SESSION_ID
        sync: false
      - key: OWNER_NUMBER
        sync: false
        - key: OWNER_NAME
        sync: false
      - key: BOT_NAME
        sync: false
      - key: PREFIX
        sync: false
      - key: MODE
        sync: false
      - key: RENDER_URL
        sync: false
